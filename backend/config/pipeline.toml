name = "체력단련장업"
path = "fitness_centers"
[[sources.PERMIT_DAILY.options.services]]
service_id = "08_26_04_P"
name = "통신판매업"
path = "ecommerce_businesses"
enabled = false               # 신고 주소가 자택·공유오피스인 경우가 많아 반경 매칭 신뢰도가 낮다. BRNO 미제공(2026-10-07 실호출)

[sources.PERMIT_FULL]         # 지방행정 인허가 전수 파일 (F-2) — 월간 모집단
display_name = "지방행정인허가"
expected_lag_days = 45

[sources.SBIZ_STORE]          # 소진공 상가(상권)정보 (S-1) — 월간 모집단(WGS84)
