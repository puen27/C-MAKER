options = { stat_code = "731Y001", item_code = "0000001", cycle = "D", lookback_days = 10, max_fallback_age_days = 7 }

[sources.OPINET_PRICE]        # 오피넷 시도별 평균 유가 (일)
display_name = "오피넷"
url = "https://www.opinet.co.kr/api/avgSidoPrice.do"
expected_lag_days = 0
options = { prodcd = "B027", max_fallback_age_days = 2 }

[sources.VWORLD_GEOCODER]     # 지점 주소 지오코딩 (RULE-BRANCH-03)
