name = "휴게음식점"
path = "rest_cafes"
[[sources.PERMIT_DAILY.options.services]]
service_id = "05_18_01_P"
name = "미용업"
path = "beauty_salons"
[[sources.PERMIT_DAILY.options.services]]
service_id = "01_01_02_P"
name = "의원"
path = "clinics"
[[sources.PERMIT_DAILY.options.services]]
service_id = "01_01_01_P"
name = "병원"
path = "hospitals"
[[sources.PERMIT_DAILY.options.services]]
service_id = "pharmacies"     # 구 개방서비스ID 미확인 — 확인되면 교체(기존 적재분 관리번호 접두어도 함께 바뀜)
name = "약국"
path = "pharmacies"
[[sources.PERMIT_DAILY.options.services]]
service_id = "03_11_03_P"
name = "숙박업"
path = "lodgings"
[[sources.PERMIT_DAILY.options.services]]
