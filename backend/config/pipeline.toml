url = "https://apis.data.go.kr/1360000"
expected_lag_days = 0
options = { short_path = "VilageFcstInfoService_2.0/getVilageFcst", mid_ta_path = "MidFcstInfoService/getMidTa", mid_land_path = "MidFcstInfoService/getMidLandFcst", short_base_time = "0200", short_num_rows = 1500, max_fallback_age_days = 1 }

[sources.KMA_NOWCAST]         # 기상청 초단기실황 — 신호 미사용, 관측 기록 축적용 스냅샷
