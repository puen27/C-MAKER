# C-MAKER 배치 파이프라인 설정 (CLAUDE.md §2: 판정 관련 값은 코드에 하드코딩하지 않는다)
#
# - 본부가 UI에서 조정하는 값(신호별 임계치, 이벤트 쿨다운/상한, 접촉 쿨다운, 상권사유비율 상한)은
#   여기가 아니라 DB THRESHOLD_CONFIG에 있다(REQ-14, UC-15).
# - 여기 있는 값은 제품 규칙(TOP 20, 탐색 슬롯 3건)과 구조적 매핑(업종×신호 적합도, 지역 코드)이다.

[recommendation]
top_n = 20                    # RULE-TARGET-03: 탐색 슬롯을 포함한 총 20건
exploration_slots = 3         # RULE-TARGET-03
exploration_enabled = false   # CLAUDE.md §9 — 탐색 슬롯 가동은 Phase 2. false면 3자리를 일반 후보로 채운다
min_sample_for_update = 30    # RULE-LEARN-03 / CONST-09
# 신호별 명부 상한(비율은 THRESHOLD_CONFIG.SIGNAL_SHARE_CAP_PCT): 주 사유가 아래 상권·거시 신호인 추천은
# 한 종류당 지점 TOP N의 상한 비율까지만 싣고, 넘치는 자리는 다음 순위 후보로 채운다. 사업장 단위 신호는 제외.
signal_share_capped_types = [
  "FX_DAILY_CHANGE", "OIL_PRICE_CHANGE", "WEATHER_WARNING",
  "TEMP_SHIFT_FORECAST", "SEASON_SHIFT_FORECAST", "FIRST_FREEZE_FORECAST", "FIRST_HEAT_FORECAST",
]
# 같은 건물 상한: 주소(쉼표 앞 도로명주소)가 같은 사업장은 명부에 이 곳수까지만 싣는다. 빈 자리는 다음 순위로
# 채우고, 후보가 모자라면 top_n 미만도 허용한다. 0이면 끈다.
same_address_cap = 2

[scoring]
proximity_min = 0.5           # 근접도: 지점 위치 1.0 → 담당 반경 경계 0.5 (선형)
industry_fit_match = 1.2      # 규모적합도: 지점 주력업종(primary_industry_tags)과 일치
industry_fit_default = 1.0
default_weight = 1.0          # SIGNAL_WEIGHT 행이 없을 때의 w₀
event_lookback_days = 7       # 스코어링에 반영하는 활성 이벤트의 최근 신호 기준 기간(일)

[normalization]               # 신호 강도 sᵢ(0~1) 정규화 포화점 — 임계치(THRESHOLD_CONFIG)와 독립
area_openings_saturation = 10       # 반경 내 신규 개업 10건/일 이상이면 1.0
industry_openings_saturation = 5    # 같은 업종 신규 개업 5건/일 이상이면 1.0
fx_change_saturation_pct = 3.0      # 환율 일변동 3% 이상이면 1.0
oil_change_saturation_pct = 3.0     # 유가 일변동 3% 이상이면 1.0
warning_intensity_advisory = 0.6    # 기상 주의보
warning_intensity_alert = 1.0       # 기상 경보
new_opening_max_age_days = 90       # 인허가일자가 이 기간 이내면 신규 개업 사업체 신호 강도 감쇠 기준

[forecast]                    # 기상청 예보 신호 판정 고정값 (임계치 자체는 THRESHOLD_CONFIG에서 본부가 조정)
shift_days = [1, 2]                 # 기온 급변: 내일·모레를 오늘과 비교
temp_shift_saturation_c = 10.0      # 기온 급변 10°C 이상이면 강도 1.0
season_shift_saturation_c = 8.0     # 계절 전환 8°C 이상이면 강도 1.0
freeze_tmin_c = 0.0                 # 첫 영하: 최저기온이 이 값 미만
heat_tmax_c = 33.0                  # 첫 폭염: 최고기온이 이 값 이상
freeze_season_start_month = 9       # 첫 영하 시즌: 9월 1일 ~ 다음 해 2월 말
heat_season_months = [5, 6, 7, 8, 9]
first_event_intensity = 0.8         # 첫 영하·첫 폭염 신호 강도
rain_pop_pct = 70                   # 날씨 참고: 1~2일 뒤 강수확률 기준(%)
weather_note_days = [1, 2]
# 날씨 참고(비·눈)를 붙이는 날씨 영향 업종 키워드
weather_note_keywords = ["음식", "카페", "커피", "편의점", "세차", "주차", "예술·스포츠", "캠핑", "아이스크림"]

[freshness]                   # RULE-TARGET-05 — 초기값 균등(2-prd.md 10장 미해결 이슈 9)
weight_license = 0.3333       # ① 인허가 경과일 감쇠
weight_no_contact = 0.3333    # ② 최근 미노출(미접촉) 기간
weight_signal_fit = 0.3334    # ③ 업종×당일신호 적합도
license_decay_days = 180      # ① exp(-경과일/180)
no_contact_saturation_days = 30

[exclusion]
# 인허가 적재 단계에서 제외하는 공공기관 업태·상호 키워드(api/11-api-spec.md §1.9).
# 업태구분명에 포함되거나 사업장명이 이 키워드로 끝나면 BUSINESS에 넣지 않는다(개업 신호도 만들지 않음).
excluded_permit_keywords = ["보건소", "보건지소", "보건진료소", "보건의료원"]

[exclusion.reject_exclusion_days]   # RULE-TARGET-01 부적합 사유별 배제 기간(일), 0 = 영구
ALREADY_CUSTOMER = 0          # 이미 거래중 — 영구
NOT_TARGET = 0                # 대상 아님 — 영구
INFO_ERROR = 90               # 정보 오류 — 한시(다음 모집단 갱신 이후 재검토)
UNREACHABLE = 0               # 접촉 불가 — 수신거부로 간주, 영구(RULE-TARGET-01 부록 C)

[briefing]
max_script_sentences = 3      # CLAUDE.md §3: 화법 3문장 이내
# RULE-BRIEF-03 금칙 표현 — 포함 시 해당 문장을 차단한다
forbidden_expressions = [
  "확정 수익", "확정수익", "원금 보장", "원금보장", "원금 손실 없", "손실 없는", "손실이 없",
  "무위험", "100% 보장", "보장된 수익", "수익 보장", "수익을 보장", "무조건", "반드시 수익",
  "손해 보실 일은 전혀 없", "손해 볼 일은 전혀 없", "손해가 전혀 없", "손해는 전혀 없", "손해 걱정 없",
]
# CLAUDE.md §0.8: 상품 안내는 상품설명서 RAG 인용이 필수. MVP에는 RAG가 없으므로(10번 문서 §16)
# 상품·여신 관련 문장은 화법에서 차단한다.
product_terms = [
  "대출", "예금", "적금", "펀드", "보험", "금리", "한도", "이자율", "수익률",
  "통장", "카드", "여신", "융자", "보증", "투자", "상품", "가입", "우대", "혜택", "수수료",
]
# 예보 단정 표현 — 화법에서 차단한다. 예보는 "~로 예보되어"처럼만 말한다(docs/2-prd.md 4장).
assertive_forecast_expressions = [
  "추워집니다", "더워집니다", "추워질 것입니다", "더워질 것입니다", "추워질 예정입니다", "더워질 예정입니다",
  "영하로 떨어집니다", "기온이 떨어집니다", "기온이 오릅니다", "비가 옵니다", "비가 내립니다", "눈이 옵니다", "눈이 내립니다",
]
default_checklist = ["사업자등록증 확인", "현재 거래 은행 확인", "카드단말기 사용 현황 확인"]
greeting_org_name = "NH농협은행"   # 화법 인사말의 기관명
max_output_tokens = 400

# ─────────────────────────── 소스 ───────────────────────────
# display_name은 출처 태그 [소스명·기준일]의 소스명으로 그대로 노출된다(RULE-BRIEF-01).
# expected_lag_days: 정상 수집 시 기준일이 오늘보다 며칠 전인지. 이보다 더 오래된 스냅샷이면 지연 배지(RULE-SENSE-04).

[sources.PERMIT_DAILY]        # 지방행정 인허가 변동분 (S-10~S-18) — 신규 개업·폐업 1차 신호
display_name = "지방행정인허가"
# 행안부 업종별 인허가 조회서비스(api/11-api-spec.md §1). 실제 호출 URL = {url}/{업종 path}/info
url = "https://apis.data.go.kr/1741000"
expected_lag_days = 2         # REQ-02: /info는 D-2 기준 현행화

[sources.PERMIT_DAILY.options]
page_size = 100               # API 1회 최대 100행(초과 요청 시 조용히 100행만 온다)
new_opening_window_days = 7
max_fallback_age_days = 3
# 변동분 창: [from, 기준일 00:00) — LAST_MDFCN_PNT 기준(§1.3, DAT_UPDT_PNT는 좌표 보정까지 잡혀 노이즈)
#   from = min(기준일 - (expected_lag_days + overlap_days), 직전 성공 창의 to - expected_lag_days)
#   직전 성공이 오래됐어도 max_lookback_days보다 과거로는 가지 않는다.
overlap_days = 1
max_lookback_days = 7
timeout_seconds = 90          # 실측 1회 20초~2분 — 공통 기본값(15초)으로는 끊긴다
max_workers = 3               # 업종 병렬 호출 수(07:30 SLA)
# 지자체 필터(OPN_ATMY_GRP_CD). 비우면 전국 변동분을 받고 지점 반경 필터만 적용한다.
#   지점 담당 반경(1km)이 걸치는 인접 구까지 포함한다. 지점 추가 시 개방자치단체코드 표(api/)에서 추가.
region_codes = [
  "3010000", "3000000", "3120000",   # 본점영업부: 서울 중구 + 종로구·서대문구
  "3160000", "3170000", "3200000",   # 구로디지털금융센터: 서울 구로구 + 금천구·관악구
  "3180000",                         # 파크원센터: 서울 영등포구
  "3440000", "3470000",              # 성당지점: 대구 남구 + 달서구
  "5710000",                         # 율량동지점: 충북 청주시(구 단위 코드 없음)
]

# 업종 = End Point. service_id는 전수 CSV(개방서비스아이디)와 같은 관리번호 접두어를 쓰기 위한 값(CONST-13)
[[sources.PERMIT_DAILY.options.services]]
service_id = "07_24_04_P"
name = "일반음식점"
path = "general_restaurants"
[[sources.PERMIT_DAILY.options.services]]
