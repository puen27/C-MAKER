# 기상청 예보 신호 — 키워드는 운영 DB 업종명(예: "소매·섬유·의복·신발 소매·여성 의류 소매업")에 맞췄다.
# "*"(전 업종 기본값)는 두지 않는다: 0.1만 줘도 다른 신호가 없는 모든 사업장의 주 사유가 예보가 되어
# (2026-10-13 dry-run에서 확인) 세무사·한식당에도 "기온 급변" 사유가 붙고 신호별 상한이 무력해진다.
